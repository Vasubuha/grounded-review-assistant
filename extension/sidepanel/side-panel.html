<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Product Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
        'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #ffffff;
      height: 100vh;
      width: 100%;
    }

    #root {
      height: 100%;
      width: 100%;
    }

    .side-panel-container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
    }

    .side-panel-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .side-panel-header h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.9;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-badge.active {
      background: #10b981;
    }

    .status-badge.loading {
      background: #f59e0b;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    .side-panel-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .loading-spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
      gap: 12px;
      color: #6b7280;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .iframe-container {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="side-panel-container">
    <div class="side-panel-header">
      <h2>🤖 RAG Product Assistant</h2>
      <div class="product-info">
        <span id="product-name">Detecting product...</span>
        <span class="status-badge" id="status-badge">Waiting</span>
      </div>
    </div>

    <div class="side-panel-content">
      <div class="loading-spinner" id="loading-indicator">
        <div class="spinner"></div>
        <span>Loading assistant...</span>
      </div>
      <div id="app-container" style="display: none; height: 100%; width: 100%;">
        <!-- React app will be injected here -->
      </div>
    </div>
  </div>

  <script src="side-panel.js"></script>
</body>
</html>
